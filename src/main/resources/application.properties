# ============================================================
# EcoHome API — Configuracion base
# Los valores sensibles se leen de variables de entorno.
# Copia .env.example a .env y rellena tus valores reales.
# ============================================================

server.port=8080

# HTTPS en produccion — descomentar y configurar keystore
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# Headers de proxy inverso (Railway/Render) — resuelve X-Forwarded-For de forma segura
server.forward-headers-strategy=framework

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecohome_db?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:ecohome_app}
spring.datasource.password=${DB_PASSWORD:EcoHome2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# JWT — expiración 1h (3600000ms). Usar variable de entorno en produccion.
# El secreto debe tener minimo 32 caracteres para HS256.
ecohome.jwt.secret=${JWT_SECRET:EcoHomeDevSecretKey2026ParaDesarrolloLocalUnicamente!!}
ecohome.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# MQTT — usar ssl://broker:8883 en produccion (HiveMQ Cloud o Mosquitto con TLS)
ecohome.mqtt.broker=${MQTT_BROKER:tcp://localhost:1883}
ecohome.mqtt.client-id=ecohome-api
ecohome.mqtt.username=${MQTT_USER:}
ecohome.mqtt.password=${MQTT_PASSWORD:}
ecohome.mqtt.enabled=${MQTT_ENABLED:true}

# CORS — en produccion poner el origen exacto del frontend, nunca *
ecohome.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Logging — DEBUG solo en desarrollo (usar application-local.properties)
logging.level.com.ecohome=INFO
logging.level.org.springframework.security=WARN
